<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="480" height="480">
  <title>notX Labs — Favicon: N</title>
  <!-- Hand-built vector. The N monogram, for favicon / app icon, like Google's G. -->
