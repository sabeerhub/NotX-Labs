  <g transform="translate(18,18) scale(0.7)">
    <polygon points="22,22 36,22 36,98 22,98" fill="#ffffff"/>
    <polygon points="84,22 98,22 98,98 84,98" fill="#ffffff"/>
    <polygon points="36,22 50,22 84,98 70,98" fill="#0071e3"/>
  </g>
</svg>
